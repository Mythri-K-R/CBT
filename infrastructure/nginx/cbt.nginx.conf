# ============================================================================
# Nginx Configuration — CBT Platform (ExamSphere)
#
# Topology: Nginx → PHP-FPM (two pools)
#   /api/monitoring/*  → php8.2-fpm-monitoring.sock  (SSE/long-poll pool)
#   /api/*             → php8.2-fpm-exam.sock         (exam engine pool)
#   /                  → php8.2-fpm-exam.sock         (web/admin)
#
# Load-test derived values:
#   Peak RPS (20k users): 3,354 req/s sustained
#   Concurrent connections (20k users + 200 SSE admins): ~20,200
#   worker_connections = ceil(20200 / worker_processes)
#
# INSTALL:
#   cp cbt.nginx.conf /etc/nginx/sites-available/cbt
#   ln -s /etc/nginx/sites-available/cbt /etc/nginx/sites-enabled/cbt
#   nginx -t && systemctl reload nginx
# ============================================================================

# ── Worker processes: one per CPU core ────────────────────────────────────────
worker_processes auto;

# ── Open file descriptor limit (per worker) ───────────────────────────────────
# Each connection uses 1 fd. At 20k connections / 4 cores = 5,000 per worker.
# Set higher to allow burst. OS ulimit must match: ulimit -n 65535
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    # Max connections per worker.
    # 20k exam + 200 SSE + headroom → 4096 per worker is sufficient on 8-core.
    # On 4-core: set to 8192. Formula: total_conn / worker_processes × 1.5
    worker_connections 4096;

    # epoll: most efficient I/O model on Linux (default on Linux, explicit here)
    use epoll;

    # Accept multiple connections per wake (reduces syscall overhead at high RPS)
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    # At 3,354 req/s, combined log is ~1 GB/hour. Use buffered logging or
    # disable access log for /api/monitoring/stream (SSE, very chatty).
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" $request_time';

    access_log  /var/log/nginx/access.log main buffer=64k flush=5s;

    # ── Performance ──────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;     # batch TCP frames (sendfile + tcp_nopush)
    tcp_nodelay        on;     # disable Nagle for keepalive connections

    # Keepalive: holds connection open for N seconds.
    # At 20k users, keepalive reduces TCP handshakes by ~95% for auto-save traffic.
    keepalive_timeout  65;
    keepalive_requests 1000;   # max requests per keepalive connection

    # ── Gzip: saves 60–70% bandwidth on JSON responses ────────────────────
    gzip              on;
    gzip_comp_level   4;       # levels 4-6 are the sweet spot (CPU vs ratio)
    gzip_min_length   256;     # don't gzip tiny responses
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml;

    # ── Buffer sizes ─────────────────────────────────────────────────────────
    # FPM responses: exam JSON payloads average ~2 KB (save-response), up to
    # ~50 KB (exam start with 180 questions). Size buffers accordingly.
    fastcgi_buffer_size     16k;
    fastcgi_buffers         16 16k;
    fastcgi_busy_buffers_size 32k;

    # ── Timeouts ─────────────────────────────────────────────────────────────
    client_header_timeout  15s;
    client_body_timeout    15s;
    send_timeout           30s;

    # ── Rate limiting zones ──────────────────────────────────────────────────
    # Nginx-level rate limiting is the first line of defense before hitting
    # Laravel's per-IP rate limiters. Keeps FPM workers free for legitimate traffic.
    #
    # Zone sizing: 1 MB stores ~16,000 state entries (each ~64 bytes).
    #   login:        10 MB = 160k unique IPs (burst of 5 without delay)
    #   exam_api:     20 MB = 320k unique IPs (exam save — high legitimate volume)
    #   public_api:   10 MB = 160k unique IPs

    limit_req_zone $binary_remote_addr zone=login:10m       rate=10r/m;
    limit_req_zone $binary_remote_addr zone=exam_api:20m    rate=300r/s;
    limit_req_zone $binary_remote_addr zone=public_api:10m  rate=60r/m;

    # Return 429 (not 503) for rate-limited requests — consistent with Laravel
    limit_req_status 429;
    limit_conn_status 429;

    # ── Real IP: trust load balancer / AWS ALB ────────────────────────────
    # Required for Laravel's trusted proxy and per-IP rate limiting to work.
    # Replace with your actual LB IP range.
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # ── Upstream: exam-engine FPM pool ────────────────────────────────────
    upstream php_exam {
        server unix:/run/php/php8.2-fpm-exam.sock;
        keepalive 64;   # persistent FPM connections (reduces socket overhead)
    }

    # ── Upstream: monitoring FPM pool (SSE) ───────────────────────────────
    upstream php_monitoring {
        server unix:/run/php/php8.2-fpm-monitoring.sock;
        keepalive 32;
    }

    # ── Shared FastCGI params ─────────────────────────────────────────────
    # Define once, include in location blocks.
    fastcgi_param  SCRIPT_FILENAME    $document_root$fastcgi_script_name;
    fastcgi_param  QUERY_STRING       $query_string;
    fastcgi_param  REQUEST_METHOD     $request_method;
    fastcgi_param  CONTENT_TYPE       $content_type;
    fastcgi_param  CONTENT_LENGTH     $content_length;
    fastcgi_param  SCRIPT_NAME        $fastcgi_script_name;
    fastcgi_param  REQUEST_URI        $request_uri;
    fastcgi_param  DOCUMENT_URI       $document_uri;
    fastcgi_param  DOCUMENT_ROOT      $document_root;
    fastcgi_param  SERVER_PROTOCOL    $server_protocol;
    fastcgi_param  REQUEST_SCHEME     $scheme;
    fastcgi_param  HTTPS              $https if_not_empty;
    fastcgi_param  GATEWAY_INTERFACE  CGI/1.1;
    fastcgi_param  SERVER_SOFTWARE    nginx/$nginx_version;
    fastcgi_param  REMOTE_ADDR        $remote_addr;
    fastcgi_param  REMOTE_PORT        $remote_port;
    fastcgi_param  SERVER_ADDR        $server_addr;
    fastcgi_param  SERVER_PORT        $server_port;
    fastcgi_param  SERVER_NAME        $server_name;
    fastcgi_param  REDIRECT_STATUS    200;

    # ============================================================
    # Virtual host: CBT API
    # ============================================================
    server {
        listen 80;
        listen [::]:80;
        server_name api.examsphere.local;   # replace with your domain

        # Redirect all HTTP to HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.examsphere.local;   # replace with your domain

        root /var/www/cbt/public;
        index index.php;

        # ── TLS ────────────────────────────────────────────────────────────
        ssl_certificate     /etc/ssl/cbt/fullchain.pem;
        ssl_certificate_key /etc/ssl/cbt/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_stapling        on;
        ssl_stapling_verify on;

        # ── Security headers ───────────────────────────────────────────────
        add_header X-Frame-Options           "SAMEORIGIN"  always;
        add_header X-Content-Type-Options    "nosniff"     always;
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ── Static assets: serve directly ─────────────────────────────────
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            expires    30d;
            add_header Cache-Control "public, immutable";
            try_files  $uri =404;
        }

        # ── Service Worker (no-cache — must always be fresh) ──────────────
        location = /exam-sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files $uri =404;
        }
        location = /exam-sw-register.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files $uri =404;
        }

        # ── FPM status pages (restrict to internal IPs) ───────────────────
        location = /fpm-status {
            fastcgi_pass   php_exam;
            include        /etc/nginx/fastcgi_params;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
            allow 10.0.0.0/8;
            allow 127.0.0.1;
            deny all;
        }
        location = /fpm-monitoring-status {
            fastcgi_pass   php_monitoring;
            include        /etc/nginx/fastcgi_params;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
            allow 10.0.0.0/8;
            allow 127.0.0.1;
            deny all;
        }

        # ── Monitoring endpoints: SSE + snapshot + health ─────────────────
        # Route to the dedicated monitoring FPM pool.
        # SSE streams MUST have proxy_buffering off — otherwise Nginx buffers
        # the response and the client never sees events until the stream closes.
        location ^~ /api/monitoring/ {
            try_files $uri $uri/ /index.php?$query_string;

            fastcgi_pass            php_monitoring;
            fastcgi_index           index.php;
            fastcgi_read_timeout    600s;   # SSE connections held open for minutes
            proxy_buffering         off;
            fastcgi_buffering       off;

            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;

            # No Nginx-level rate limiting on monitoring — admins are trusted
            # and limited to 200 connections via the FPM pool cap.
        }

        # ── Exam API: save-response + timer-sync (highest volume) ─────────
        # Nginx rate limit: 300 req/s per IP. Legitimate auto-save from a
        # single student IP is ≤ 1 req/10s = 6 req/min. 300/s allows 50
        # students per source IP (NAT scenarios) while blocking floods.
        location ^~ /api/test/exam/ {
            try_files $uri $uri/ /index.php?$query_string;

            fastcgi_pass          php_exam;
            fastcgi_index         index.php;
            fastcgi_read_timeout  60s;

            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;

            limit_req zone=exam_api burst=50 nodelay;
        }

        # ── Login: tighter rate limit ─────────────────────────────────────
        location ^~ /api/auth/login {
            try_files $uri $uri/ /index.php?$query_string;

            fastcgi_pass          php_exam;
            fastcgi_index         index.php;
            fastcgi_read_timeout  30s;

            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;

            limit_req zone=login burst=5 nodelay;
        }

        # ── All other API routes ──────────────────────────────────────────
        location ^~ /api/ {
            try_files $uri $uri/ /index.php?$query_string;

            fastcgi_pass          php_exam;
            fastcgi_index         index.php;
            fastcgi_read_timeout  30s;

            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;

            limit_req zone=public_api burst=20 nodelay;
        }

        # ── Horizon dashboard (restrict to VPN/internal) ──────────────────
        location ^~ /horizon {
            try_files $uri $uri/ /index.php?$query_string;

            fastcgi_pass          php_exam;
            fastcgi_index         index.php;

            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;

            allow 10.0.0.0/8;
            allow 127.0.0.1;
            deny all;
        }

        # ── Default PHP handler (web/admin) ───────────────────────────────
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            try_files      $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass   php_exam;
            fastcgi_index  index.php;
            fastcgi_read_timeout 30s;

            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT   $realpath_root;
        }

        # ── Block dot-files and sensitive paths ───────────────────────────
        location ~ /\.(?!well-known) {
            deny all;
        }
        location = /robots.txt  { access_log off; return 204; }
        location = /favicon.ico { access_log off; return 204; }

        # ── Disable access log for SSE stream (too chatty) ────────────────
        location = /api/monitoring/exams {
            access_log off;
        }
    }
}
