# ============================================================================
# Redis 7 Configuration — CBT Platform (ExamSphere)
#
# LOAD-TEST MEASUREMENTS that drove these values:
#   Redis ops/s at 20k users:  ~8,000 ops/s
#     Breakdown per save-response (2,000/s × 4 ops each):
#       - HGETALL exam:state:{attemptId}          (ExamStateCacheService)
#       - HMSET exam:state:{attemptId}            (updateActivity)
#       - HINCRBY exam:state:{attemptId} answered (adjustAnsweredCount)
#       - SETEX mon:hb:{attemptId}                (UpdateHeartbeatStatus — synchronous)
#     + timer-sync (667/s × 1 op each):
#       - HGETALL exam:state:{attemptId}          (TimerService hot path)
#     + Horizon queue ops (RPUSH/BRPOP):
#       - ~2,000 analytics + monitoring jobs/s at peak
#     Total: ~8,000 ops/s sustained; ~12,000 ops/s burst at submission storm
#
# REDIS DB LAYOUT (from config/database.php):
#   DB 0 (default)   — exam state (exam:state:*, mon:*, Horizon queue data)
#   DB 1 (cache)     — Laravel Cache (tagged cache, result cache)
#   DB 2 (queue)     — Horizon job payloads
#   DB 3 (session)   — Laravel sessions
#
# TIER REFERENCE — change maxmemory to match your Redis server RAM:
#
#   Tier     | Redis RAM | maxmemory | connected_clients (expected)
#   ---------|-----------|-----------|-----------------------------
#   1k users |    4 GB   |   2688mb  |    ~100
#   5k users |    8 GB   |   5632mb  |    ~200
#  10k users |   16 GB   |  11264mb  |    ~400
#  20k users |   32 GB   |  22528mb  |    ~750
#
# INSTALL:
#   cp redis.conf /etc/redis/redis.conf
#   systemctl restart redis-server
#   Verify: redis-cli INFO memory | grep used_memory_human
# ============================================================================

# ── Network ───────────────────────────────────────────────────────────────
bind 127.0.0.1 ::1       # change to 0.0.0.0 if Redis is on a separate host
protected-mode yes
port 6379
tcp-backlog 511
timeout 0                # keep connections alive (FPM workers hold persistent conns)
tcp-keepalive 60         # send TCP keepalive every 60s to detect dead connections

# ── Clients ───────────────────────────────────────────────────────────────
# phpredis uses persistent connections: one per FPM worker.
# 600 exam workers + 200 monitoring workers + 80 Horizon workers + headroom
maxclients 10000

# ── Memory ────────────────────────────────────────────────────────────────
# Set to 70% of available RAM. The remaining 30% is for OS + Redis overhead.
#   20k tier (32 GB dedicated): 32 × 1024 × 0.70 = 22528 MB
# See tier table above for other sizes.
maxmemory 22528mb

# Eviction policy: allkeys-lru
#   - Evicts the least-recently-used key across ALL databases.
#   - Correct for our workload: exam state keys have TTL set explicitly.
#     If Redis fills up, evicting old cache entries is acceptable.
#   - Do NOT use volatile-lru: exam state keys without TTL would never be
#     evicted, causing OOM on the keys that matter most.
#   - Do NOT use noeviction: Redis would return errors under memory pressure,
#     causing PHP exceptions during live exams.
maxmemory-policy allkeys-lru

# Memory sampling accuracy for LRU approximation.
# Higher = more accurate eviction, more CPU. 10 is a good balance.
maxmemory-samples 10

# ── Persistence: disabled for pure exam-state cache ───────────────────────
# The exam state in Redis is rebuilt from MySQL on Redis restart
# (Feature 7: ExamSessionRecoveryService + WarmupExamStateCache command).
# RDB/AOF add I/O overhead. Disable both.
#
# EXCEPTION: if you want Horizon job durability across Redis restarts,
# enable AOF on DB 2 only — but this requires Redis Cluster or separate
# Redis instances per DB. For a single Redis instance, either accept
# job loss on crash (Horizon retries) or use RDB for the job DB.
#
# For now: disable all persistence. Horizon's retry mechanism + circuit
# breakers (Feature 7) handle Redis restart recovery.
save ""
appendonly no

# ── Background operations ─────────────────────────────────────────────────
# Hz: background task frequency (key expiry, connection cleanup).
# At 20k users with 20,000 TTL-bearing keys expiring at exam end,
# higher hz cleans up faster but uses more CPU.
hz 20
dynamic-hz yes           # scale hz up when there are more clients

# ── Slow log ─────────────────────────────────────────────────────────────
# Log any Redis command taking > 10 ms (10,000 µs).
# At 8,000 ops/s, a slow command blocks the event loop for all other ops.
slowlog-log-slower-than 10000
slowlog-max-len 128

# ── Latency monitoring ────────────────────────────────────────────────────
latency-monitor-threshold 50    # alert on event loop stalls > 50 ms
latency-tracking yes
latency-tracking-info-percentiles 50 95 99

# ── Dangerous commands: rename to prevent accidental data loss ────────────
# FLUSHALL would wipe all 4 Redis DBs including active exam state.
# Renaming forces intentional use via the renamed command.
rename-command FLUSHALL  FLUSHALL_DISABLED_CBT
rename-command FLUSHDB   FLUSHDB_DISABLED_CBT
rename-command DEBUG     ""
rename-command CONFIG    REDIS_CONFIG_CBT

# ── Lua scripting timeout ────────────────────────────────────────────────
lua-time-limit 5000

# ── Active rehashing ─────────────────────────────────────────────────────
activerehashing yes

# ── Connection close on client timeout (prevents dead connection buildup) ──
# With phpredis persistent connections this is less of an issue, but
# if a FPM worker dies without closing gracefully, Redis keeps the socket.
# Use tcp-keepalive (set above) to detect and close dead connections.

# ── Unix socket (optional — same-host Nginx/PHP setup only) ──────────────
# If PHP-FPM and Redis are on the same server, a Unix socket is ~20%
# faster than TCP (eliminates TCP stack overhead).
# Uncomment if co-located:
# unixsocket /run/redis/redis-server.sock
# unixsocketperm 770

# ── Replication (Feature 8: read replica support) ─────────────────────────
# Uncomment on the REPLICA server (not primary):
# replicaof <primary-ip> 6379
# masterauth <primary-password>
# replica-read-only yes
# replica-lazy-flush yes     # async replica flush — reduces replica lag

# ── Auth ──────────────────────────────────────────────────────────────────
# Set a strong password. Must match REDIS_PASSWORD in Laravel .env.
requirepass changeme_strong_redis_password_here

# ── Log ───────────────────────────────────────────────────────────────────
loglevel notice
logfile /var/log/redis/redis-server.log
