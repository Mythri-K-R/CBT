; ============================================================================
; PHP-FPM Pool: monitoring (SSE)
; Serves ONLY: GET /api/monitoring/exams/{testId}/stream (SSE)
;              GET /api/monitoring/exams/{testId}/snapshot
;              GET /api/monitoring/overview
;              GET /api/monitoring/health
;              GET /api/monitoring/recovery
;
; ISOLATION RATIONALE (from load-test bottleneck analysis):
;   Each SSE connection holds one FPM worker for the connection lifetime
;   (MonitoringController streams with 3-second sleep loop).
;   200 admin dashboards = 200 workers permanently occupied.
;   Without isolation, those 200 workers are taken from the exam pool,
;   removing 33% of capacity from 2,000 save-response calls/s.
;   With a dedicated pool, SSE connections can never starve exam workers.
;
; SIZING:
;   Expected SSE connections:  200  (scenario 06 baseline; allow 2× headroom)
;   pm.max_children            = 400
;   RAM at 400 workers × 50MB  = 20 GB  (aggressive; use 'static' to cap it)
;
;   For most deployments, 200 concurrent admins watching live exams is a
;   reasonable upper bound. Raise to 400 if you serve multiple simultaneous
;   exams across institutions from a single server.
;
; INSTALL: copy to /etc/php/8.2/fpm/pool.d/monitoring-pool.conf
; ============================================================================

[monitoring]

user  = www-data
group = www-data

; Separate socket — Nginx routes /api/monitoring/* here
listen = /run/php/php8.2-fpm-monitoring.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; static: SSE workers are long-lived (held open for stream duration).
; dynamic would spawn/despawn too aggressively for persistent connections.
pm = static
pm.max_children = 200

; SSE workers are long-lived but low CPU. Recycle every 200 requests
; (each "request" is one stream connection) to prevent slow leaks.
pm.max_requests = 200

; SSE streams can run for minutes. Set a long terminate timeout but
; ensure Nginx proxy_read_timeout is shorter so clients reconnect cleanly.
request_terminate_timeout = 600s

; Slow-log threshold: monitoring endpoints should respond in < 500 ms.
; SSE stream itself is exempt (it never "finishes" until disconnect).
slowlog = /var/log/php-fpm/monitoring-slow.log
request_slowlog_timeout = 5s

env[APP_ENV]        = $APP_ENV
env[APP_KEY]        = $APP_KEY
env[DB_HOST]        = $DB_HOST
env[DB_PASSWORD]    = $DB_PASSWORD
env[REDIS_HOST]     = $REDIS_HOST
env[REDIS_PASSWORD] = $REDIS_PASSWORD

pm.status_path = /fpm-monitoring-status
ping.path      = /fpm-monitoring-ping
ping.response  = pong

clear_env = no
