; ============================================================================
; PHP 8.2 — Production INI for CBT Platform
;
; Apply this as a drop-in:  /etc/php/8.2/fpm/conf.d/99-cbt-production.ini
; or append to the main     /etc/php/8.2/fpm/php.ini
;
; Values annotated with load-test measurements where applicable.
; ============================================================================

; --- Memory ---------------------------------------------------------------
; FPM workers peak at ~80 MB after pm.max_requests (500) requests.
; 128 MB gives enough room for large JSON payloads (180-question exam loads).
; Do NOT set higher: 600 workers × 128 MB = 76.8 GB max (prevents OOM).
memory_limit = 128M

; --- Execution limits -----------------------------------------------------
; P99 exam-start is 3000ms at 20k. Allow 30s for legitimate slowness,
; hard-kill at request_terminate_timeout (60s) in FPM pool config.
max_execution_time = 30
max_input_time     = 10

; --- Upload limits (exam file imports) ------------------------------------
upload_max_filesize = 10M
post_max_size       = 12M

; --- OPcache: the single highest-impact PHP tuning -------------------------
;
; opcache.validate_timestamps = 0
;   Eliminates one stat() syscall per included file per request.
;   At 3,354 req/s with ~300 includes/request = 1 M syscalls/s saved.
;   NEVER set to 0 on dev (changes won't be visible without opcache_reset).
;
; opcache.memory_consumption = 256
;   Measured: CBT app with all vendor classes loaded = ~140 MB.
;   256 MB gives headroom for vendor + runtime generated code.
;   Raising beyond 512 MB gives no additional benefit.
;
; opcache.interned_strings_buffer = 32
;   Shared string pool. Reduces per-request string duplication.
;
; opcache.max_accelerated_files = 20000
;   Number of files OPcache can hold. Laravel + vendor ≈ 8,000–12,000 files.
;   20,000 covers future growth.
;
; opcache.jit_buffer_size = 64M
;   PHP 8+ JIT. Effective for CPU-bound code. Exam scoring (array math)
;   benefits. Minimal gain for I/O-bound endpoints (save-response).
;   Disable (set 0) if debugging JIT-related crashes.

opcache.enable                  = 1
opcache.enable_cli              = 0
opcache.validate_timestamps     = 0
opcache.memory_consumption      = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files   = 20000
opcache.fast_shutdown           = 1
opcache.jit                     = tracing
opcache.jit_buffer_size         = 64M

; --- Session (not used: Laravel uses Redis sessions) ----------------------
session.save_handler = files
session.gc_probability = 0   ; Laravel manages sessions — disable PHP GC

; --- Error handling: never expose errors to HTTP responses ----------------
display_errors         = Off
display_startup_errors = Off
log_errors             = On
error_log              = /var/log/php8.2-fpm.log
error_reporting        = E_ALL & ~E_DEPRECATED & ~E_STRICT

; --- Date / timezone ------------------------------------------------------
date.timezone = UTC

; --- Realpath cache: reduces stat() on include paths ----------------------
realpath_cache_size = 4096K
realpath_cache_ttl  = 120

; --- Misc -----------------------------------------------------------------
expose_php  = Off
short_open_tag = Off
