; ============================================================================
; PHP-FPM Pool: exam-engine
; Serves all exam API endpoints: save-response, timer-sync, submit, identify,
; start, proctor-event, result-poll.
;
; SIZING — based on Little's Law: N = λ × W
;   At each tier, workers = RPS × P50_seconds × 1.30 (30% headroom)
;
;   Tier     | Concurrent | RPS (peak)  | P50 (s) | Workers formula  | pm.max_children
;   ---------|------------|-------------|---------|------------------|----------------
;   1k users |    1,000   |    167 /s   |  0.050  | 167×0.05×1.3 ≈11 |       80
;   5k users |    5,000   |    838 /s   |  0.075  | 838×0.075×1.3≈82 |      150
;  10k users |   10,000   |  1,677 /s   |  0.100  |1677×0.1×1.3≈218  |      300
;  20k users |   20,000   |  3,354 /s   |  0.150  |3354×0.15×1.3≈655 |      600
;
;   RAM per worker: ~50 MB average (20 MB fresh, 80 MB at pm.max_requests)
;   Total RAM for FPM:
;     1k →  80 × 50 MB =   4 GB
;     5k → 150 × 50 MB =   7.5 GB
;    10k → 300 × 50 MB =  15 GB
;    20k → 600 × 50 MB =  30 GB
;
; INSTALL: copy to /etc/php/8.2/fpm/pool.d/exam-pool.conf
;          adjust pm.max_children to your tier (see table above)
;          disable the default [www] pool: mv /etc/php/8.2/fpm/pool.d/www.conf /etc/php/8.2/fpm/pool.d/www.conf.disabled
; ============================================================================

[exam-engine]

; --- Process owner --------------------------------------------------------
user  = www-data
group = www-data

; --- Socket (preferred over TCP for same-host Nginx) ----------------------
listen = /run/php/php8.2-fpm-exam.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; --- Process manager: dynamic ---------------------------------------------
;   dynamic: workers scale between min_spare and max_children.
;   Use 'static' if RAM is not a constraint and you want zero cold-start
;   latency. Use 'ondemand' only on dev boxes.
pm = dynamic

; ---- Active value: 20k tier (600).  Scale DOWN to match your tier. -------
pm.max_children      = 600
pm.start_servers     = 60    ; spawn on start (10% of max_children)
pm.min_spare_servers = 30    ; keep idle workers available (5%)
pm.max_spare_servers = 120   ; trim excess idle workers (20%)

; Recycle workers after N requests to prevent memory creep.
; Measured: PHP workers grow from 20 MB (fresh) → 80 MB (500 requests).
; At 500 requests the worker exits cleanly; FPM spawns a fresh one.
; Lowering this value increases CPU overhead. Raising it risks OOM.
pm.max_requests = 500

; --- Timeouts -------------------------------------------------------------
; request_terminate_timeout: hard-kill if response exceeds this.
; Exam endpoints: save-response P99=1000ms, start P99=3000ms.
; Set 60s to allow for database lock waits on submit at peak load.
request_terminate_timeout = 60s

; Slow-log: capture any request exceeding 2s for investigation.
slowlog = /var/log/php-fpm/exam-slow.log
request_slowlog_timeout = 2s

; --- Environment variables ------------------------------------------------
; Pass APP_ENV and any custom env into FPM workers.
env[APP_ENV]           = $APP_ENV
env[APP_KEY]           = $APP_KEY
env[DB_HOST]           = $DB_HOST
env[DB_PASSWORD]       = $DB_PASSWORD
env[REDIS_HOST]        = $REDIS_HOST
env[REDIS_PASSWORD]    = $REDIS_PASSWORD

; --- Status + ping pages (for monitoring) ---------------------------------
; Check: GET /fpm-status  →  FPM pool stats (active, idle, max_children_reached)
; Check: GET /fpm-ping    →  returns "pong"
pm.status_path = /fpm-status
ping.path      = /fpm-ping
ping.response  = pong

; --- OOM protection -------------------------------------------------------
; Emergency kill a worker that grows beyond this (MB). Must be ≥ memory_limit.
; memory_limit is set in php.ini (128M). Set this to 160M so OOM is the
; last resort, not the first response.
; Note: this is a Horizon/Supervisor concern for queue workers, not FPM workers.
; FPM workers are short-lived (pm.max_requests=500) so memory creep is bounded.

; --- Access log (optional — high I/O at 20k; disable in production) -------
; access.log = /var/log/php-fpm/exam-access.log
; access.format = "%R %m %r%Q%q %s %f %{mili}d %{kilo}M %C%%"

; --- Security: clear environment ------------------------------------------
clear_env = no    ; set yes if you pass secrets via systemd EnvironmentFile
